services:
# === backend === #
  backend_dev:
    build: 
      context: backend/
      target: development
    depends_on:
      db_dev:
        condition: service_healthy
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - DB_PORT=5432
      - DB_HOST=db_dev
    ports:
      - "${BACKEND_PORT}:3000"
    volumes:
      - ./backend:/home/node
      - /home/node/node_modules
    networks:
      - backend_dev
      - backend_inner_dev
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  
  db_dev:
    image: postgres:18
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_DATABASE}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql
    networks:
      - backend_inner_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5

# === frontend === #
  frontend_dev:
    build: 
      context: frontend/
      target: development
    depends_on:
      backend_dev:
        condition: service_healthy
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./frontend:/home/node
      - /home/node/node_modules
    networks:
      - frontend_dev
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

# === routing === #
  nginx_dev:
    build:
      context: nginx/
    depends_on:
      backend_dev:
        condition: service_healthy
      frontend_dev:
        condition: service_healthy
    environment:
      BACKEND_HOST: backend_dev
      BACKEND_PORT: 3000  
      FRONTEND_HOST: frontend_dev
      FRONTEND_PORT: 3000   
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template
    networks:
      - backend_dev
      - gateway_dev
      - frontend_dev
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null http://127.0.0.1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

      # === settings === #
volumes:
  postgres_dev_data:

networks:
  backend_inner_dev:
    driver: bridge
  backend_dev:
    driver: bridge
  frontend_dev:
    driver: bridge
  gateway_dev:
    driver: bridge

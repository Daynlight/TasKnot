services:
# === backend === #
  backend:
    build: 
      context: backend/
      target: production
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - DB_PORT=5432
      - DB_HOST=db
    networks:
      - backend
      - backend_inner
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  
  db:
    image: postgres:18
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_DATABASE}    
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend_inner
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5

# === frontend === #
  frontend:
    build: 
      context: frontend/
      target: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

# === routing === #
  nginx:
    build:
      context: nginx/
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 3000
      FRONTEND_HOST: frontend
      FRONTEND_PORT: 3000   
    networks:
      - gateway
      - backend
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null http://127.0.0.1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  cloudflare:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      - "TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}"
    networks:
      - gateway

# === settings === #
volumes:
  postgres_data:

networks:
  backend_inner:
    driver: bridge
  backend:
    driver: bridge
  frontend:
    driver: bridge
  gateway:
    driver: bridge
